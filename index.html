<script>
let tronWeb;
const CONTRACT = "TRtajVqpr8g2YAhCUvYg7g2jksbxxacxoh";

// Connect wallet with permission request
async function connectWallet() {
    try {
        // request permission
        if (window.tronLink) {
            await window.tronLink.request({ method: 'tron_requestAccounts' });
        }

        // check tronWeb
        if (window.tronWeb && window.tronWeb.defaultAddress.base58) {
            tronWeb = window.tronWeb;

            document.getElementById("wallet").innerText =
                "Connected: " + tronWeb.defaultAddress.base58;
        } else {
            alert("TronLink not detected. Please reload.");
        }

    } catch (e) {
        alert("User rejected connection or TronLink not working");
    }
}

// Send token
async function sendToken() {
    try {
        if (!tronWeb) {
            alert("Connect wallet first");
            return;
        }

        const to = document.getElementById("to").value;
        const amount = document.getElementById("amount").value;

        const contract = await tronWeb.contract().at(CONTRACT);

        document.getElementById("status").innerText = "Sending...";

        const tx = await contract.transfer(to, amount).send({
            feeLimit: 10000000
        });

        document.getElementById("status").innerText =
            "Success TX: " + tx;

    } catch (e) {
        document.getElementById("status").innerText =
            "Error: " + e.message;
    }
}

// auto fill
window.onload = function () {
    document.getElementById("to").value =
        "TNvLsEeNjM4ZVkZJLEZR8Sm3CKWfWWR5kn";
};
</script>
