<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tron Token Transfer</title>
</head>
<body>

  <h2>Transfer Tron Tokens</h2>
  <button onclick="connectWallet()">Connect Wallet</button>
  <p id="wallet">Not connected to wallet yet</p>

  <h3>Contract Settings</h3>
  <label for="contractAddress">Contract Address:</label>
  <input type="text" id="contractAddress" placeholder="Contract Address (TRtajVqpr8g2YAhCUvYg7g2jksbxxacxoh)" />

  <label for="receiverAddress">Receiver Address:</label>
  <input type="text" id="receiverAddress" placeholder="Receiver Address" />

  <h3>Token Transfer</h3>
  <label for="amount">Amount:</label>
  <input type="number" id="amount" placeholder="Amount of TRX to transfer" />

  <button onclick="transferTokens()">Transfer Tokens</button>

  <script src="https://cdn.jsdelivr.net/npm/tron-web3@1.5.0/dist/tronweb.min.js"></script>
  <script>
    let tronWeb;
    let contractAddress;
    let receiverAddress;
    let amount;

    function connectWallet() {
      tronWeb = new TronWeb({
        fullNode: 'https://api.trongrid.com',
        solidityNode: 'https://api.trongrid.com',
        eventServer: 'https://api.trongrid.com',
      });

      const account = tronWeb.tron.defaultAccount;
      if (account) {
        document.getElementById('wallet').innerHTML = account;
        contractAddress = document.getElementById('contractAddress').value;
        receiverAddress = document.getElementById('receiverAddress').value;
        amount = document.getElementById('amount').value;
      } else {
        document.getElementById('wallet').innerHTML = 'Not connected to wallet yet';
      }
    }

    function transferTokens() {
      if (!tronWeb || !contractAddress || !receiverAddress || !amount) {
        alert('Please connect wallet and fill in contract address, receiver address and amount');
        return;
      }

      const contract = tronWeb.tron.contract(contractAddress, (tronWeb.tron.getAbiFromAddress(contractAddress)));
      contract.createTransaction({
        to: receiverAddress,
        value: tronWeb.tron.toSun(amount),
        feeLimit: 1000000,
      })
      .then((tx) => {
        return tronWeb.tron.sendTransaction(tx);
      })
      .then((txHash) => {
        console.log('Transaction hash:', txHash);
        alert('Tokens transferred successfully!');
      })
      .catch((error) => {
        console.error('Error:', error);
        alert('Error transferring tokens');
      });
    }
  </script>
</body>
</html>
