<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Tron Token Transfer</title>
</head>
<body>

<h2>Transfer Tron Tokens</h2>
<button id="connectWalletBtn">Connect Wallet</button>
<p id="wallet">Wallet is not connected</p>

<h3>Contract Settings</h3>
<label for="contractAddress">Contract Address:</label>
<input type="text" id="contractAddress" placeholder="Contract Addres" />

<label for="receiverAddress">Receiver Address:</label>
<input type="text" id="receiverAddress" placeholder="TWCLMXTA9XQj9eLrAq9Fth6URCux656FVa" />

<h3>Amount</h3>
<input type="number" id="amount" placeholder="Amount of tokens" />

<button id="transferBtn">Transfer Tokens</button>

<script>
  let tronWeb;

  // Connect Wallet button click handler
  document.getElementById('connectWalletBtn').onclick = async () => {
    if (window.tronWeb && window.tronWeb.ready) {
      tronWeb = window.tronWeb;
      document.getElementById('wallet').innerText = 'Connected: ' + tronWeb.defaultAddress.base58;
    } else {
      alert('Please install TronLink extension and log in.');
    }
  };

  // Transfer button click handler
  document.getElementById('transferBtn').onclick = async () => {
    if (!tronWeb || !tronWeb.defaultAddress || !tronWeb.defaultAddress.base58) {
      alert('Please connect your wallet first.');
      return;
    }

    const contractAddress = document.getElementById('contractAddress').value.trim();
    const receiverAddress = document.getElementById('receiverAddress').value.trim();
    const amount = document.getElementById('amount').value.trim();

    if (!contractAddress || !receiverAddress || !amount) {
      alert('Please fill in all fields.');
      return;
    }

    try {
      // Access the contract
      const contract = await tronWeb.contract().at(contractAddress);
      // Call the transfer method
      const transaction = await contract.transfer(receiverAddress, tronWeb.toSun(amount)).send({
        feeLimit: 100_000_000,
        callValue: 0
      });
      alert('Transaction successful! Tx Hash: ' + transaction);
    } catch (err) {
      console.error(err);
      alert('Error: ' + err.message);
    }
  };
</script>

</body>
</html>
